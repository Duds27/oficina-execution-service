name: CI

# Roda em PR e push na main, e é reutilizado pelo CD (workflow_call).
# O job build-test-quality é o "required check" da proteção da main. Ele falha com:
#   - teste vermelho;
#   - cobertura de linhas abaixo de 80% (ReportGenerator, todos os projetos de teste juntos);
#   - quality gate do SonarCloud reprovado (sonar.qualitygate.wait).
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

env:
  SONAR_ORGANIZATION: duds27
  SONAR_PROJECT_KEY: Duds27_oficina-execution-service
  COBERTURA_MINIMA: 80

jobs:
  build-test-quality:
    name: build-test-quality
    runs-on: ubuntu-latest
    env:
      # Vazio em PR de fork e do Dependabot: os passos do Sonar são pulados.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o Sonar usa o histórico (blame e código novo)

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Java (SonarScanner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ferramentas
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 11.3.0
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.12

      - name: SonarCloud (begin)
        if: env.SONAR_TOKEN != ''
        run: >
          dotnet sonarscanner begin
          /k:"${SONAR_PROJECT_KEY}" /o:"${SONAR_ORGANIZATION}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="${SONAR_TOKEN}"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
          /d:sonar.qualitygate.wait=true
          /d:sonar.qualitygate.timeout=300

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # O coverlet.runsettings gera a cobertura em dois formatos: cobertura (ReportGenerator)
      # e opencover (Sonar).
      - name: Test
        run: >
          dotnet test -c Release --no-build
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --results-directory TestResults

      - name: Relatório de cobertura
        if: always()
        run: |
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage-report \
            -reporttypes:"Cobertura;MarkdownSummaryGithub;TextSummary"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: SonarCloud (end + quality gate)
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Cobertura mínima
        run: |
          taxa=$(sed -n 's/.*<coverage[^>]* line-rate="\([0-9.]*\)".*/\1/p' coverage-report/Cobertura.xml | head -1)
          pct=$(awk -v t="$taxa" 'BEGIN { printf "%.1f", t * 100 }')
          echo "Cobertura de linhas: ${pct}% (mínimo ${COBERTURA_MINIMA}%)"
          if ! awk -v p="$pct" -v m="$COBERTURA_MINIMA" 'BEGIN { exit !(p >= m) }'; then
            echo "::error::Cobertura de linhas ${pct}% abaixo do mínimo de ${COBERTURA_MINIMA}%."
            exit 1
          fi

      # Contrato HTTP versionado em docs/openapi.json, consultável sem subir a aplicação. O CLI
      # do Swashbuckle sobe o host só até o Build (sem banco nem broker), por isso a configuração
      # mínima nas variáveis. Endpoint mudou e o arquivo não? O passo falha com o comando para gerar.
      - name: OpenAPI (docs/openapi.json)
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Jwt__Key: "OficinaMecanicaSecretKeyMustBe32CharactersMin!"
        run: |
          dotnet tool install --global Swashbuckle.AspNetCore.Cli --version 6.9.0
          swagger tofile --output docs/openapi.json src/Oficina.Execution.API/bin/Release/net8.0/Oficina.Execution.API.dll v1
          if ! git diff --exit-code -- docs/openapi.json; then
            echo "::error::docs/openapi.json desatualizado. Gere de novo com: swagger tofile --output docs/openapi.json src/Oficina.Execution.API/bin/Release/net8.0/Oficina.Execution.API.dll v1 (depois de um build Release)."
            exit 1
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage-report/
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

      - name: Docker build
        run: docker build -t oficina-execution-service:ci .

  # Terraform da tabela, da role do pod (Pod Identity) e do ECR (infra/). Os testes usam provider mockado:
  # não precisam de conta AWS nem do estado remoto.
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init (sem backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Test
        run: terraform test
