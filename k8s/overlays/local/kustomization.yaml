apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay LOCAL (kind): imagem local, Secret de desenvolvimento e o banco no próprio cluster.
#   docker build -t oficina-execution-service:local .
#   kind load docker-image oficina-execution-service:local --name <cluster>
#   kubectl apply -k k8s/overlays/local
# Pré-requisito: o overlay local do oficina-os-service, que sobe o RabbitMQ no namespace
# messaging (mesmo DNS do EKS). Ordem: os-service → billing-service → execution-service.
#
# Sem "namespace:" aqui: a base já põe os recursos dela em oficina-execution, e os daqui dizem o seu.
resources:
  - ../../base
  - namespace.yaml
  - secret.yaml
  - dynamodb.yaml

images:
  - name: oficina-execution-service
    newTag: local

patches:
  # 1 réplica no kind; o HPA da base continua (2 a 5) para a demonstração de escala.
  - target:
      kind: Deployment
      name: execution-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: execution-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target:
      kind: ConfigMap
      name: execution-service-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: execution-service-config
      data:
        ASPNETCORE_ENVIRONMENT: "Development"
        # DynamoDB Local: com ServiceUrl, o serviço cria a tabela sozinho no boot.
        DynamoDb__ServiceUrl: "http://dynamodb:8000"
        AWS_REGION: "us-east-1"
