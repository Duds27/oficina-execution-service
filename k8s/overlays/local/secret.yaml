# ATENÇÃO: valores de EXEMPLO, só para o kind. Na AWS, o Secret execution-service-secrets é criado pelo
# CD a partir do Secrets Manager e não fica versionado.
apiVersion: v1
kind: Secret
metadata:
  name: execution-service-secrets
  namespace: oficina-execution
type: Opaque
stringData:
  Jwt__Key: "OficinaMecanicaSecretKeyMustBe32CharactersMin!"
  RabbitMq__Username: "oficina"
  RabbitMq__Password: "oficina_dev"
  # Credenciais fictícias: o DynamoDB Local não valida, mas o AWS SDK exige algum valor.
  AWS_ACCESS_KEY_ID: "local"
  AWS_SECRET_ACCESS_KEY: "local"
