# DynamoDB Local em memória (os dados somem quando o pod reinicia). Na AWS, a tabela é a do
# infra/ deste repo, acessada pela role do Pod Identity.
apiVersion: v1
kind: Service
metadata:
  name: dynamodb
  namespace: oficina-execution
  labels:
    app: dynamodb
spec:
  selector:
    app: dynamodb
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamodb
  namespace: oficina-execution
  labels:
    app: dynamodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamodb
  template:
    metadata:
      labels:
        app: dynamodb
    spec:
      containers:
        - name: dynamodb
          image: amazon/dynamodb-local:2.6.1
          args: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
